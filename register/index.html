<!DOCTYPE html>
<html lang="en-GB" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/#register" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- This page exists only to forward /register to the panel on the home
         page, so it should never be indexed in its own right, and it points
         search engines at the page it forwards to. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://percivalestate.com/" />

    <title>Register &middot; Percival Estate Community</title>

    <!-- Kept because /register is the address that goes on posters and in
         messages between neighbours, so it is the one people paste into chat
         apps. Meta tags cost nothing to serve; the stylesheets did. -->
    <meta
      name="description"
      content="Register your interest in the Percival Estate Community - Grimthorpe House, Crayle House, Partridge Court, Tompion House, Earnshaw House & Cyrus House"
    />
    <meta property="og:site_name" content="Percival Estate Community" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Percival Estate Community" />
    <meta property="og:url" content="https://percivalestate.com/#register" />
    <meta
      property="og:description"
      content="Register your interest in the Percival Estate Community - Grimthorpe House, Crayle House, Partridge Court, Tompion House, Earnshaw House & Cyrus House"
    />
    <meta
      property="og:image"
      content="https://percivalestate.com/images/meta-cover.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Percival Estate Community" />
    <meta
      name="twitter:description"
      content="Register your interest in the Percival Estate Community - Grimthorpe House, Crayle House, Partridge Court, Tompion House, Earnshaw House & Cyrus House"
    />
    <meta
      name="twitter:image"
      content="https://percivalestate.com/images/meta-cover.png"
    />

    <!-- Deliberately no stylesheets, icons or fonts: everything this page used
         to pull in belonged to a home page the visitor is about to be sent to
         anyway, and none of it was on screen long enough to be seen. -->
    <style>
      body {
        background-color: #1b1f22;
        color: #ffffff;
        font-family: Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 2rem;
        text-align: center;
      }

      a {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <p>
      Redirecting to the
      <a href="/#register">Percival Estate Community registration form</a>...
    </p>
    <script>
      // replace() rather than assignment, so Back doesn't land here and
      // immediately bounce the visitor forward again.
      window.location.replace('/#register');
    </script>
  </body>
</html>
