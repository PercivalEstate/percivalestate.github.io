<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="robots" content="noindex" />
    <title>Page not found &middot; Percival Estate Community</title>

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#288548" />

    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      // Consent Mode: analytics storage stays denied, so GA sets no cookie,
      // until the visitor accepts in the banner that assets/js/consent.js
      // shows. Granting a stored consent here rather than waiting for that
      // file keeps the pageview from being missed.
      gtag("consent", "default", { analytics_storage: "denied" });

      try {
        if (localStorage.getItem("pec-cookie-consent") === "granted") {
          gtag("consent", "update", { analytics_storage: "granted" });
        }
      } catch (e) {
        // Storage is blocked; the denied default stands.
      }
    </script>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-N85MHLCZ5L"
    ></script>
    <script>
      gtag("js", new Date());

      gtag("config", "G-N85MHLCZ5L");
    </script>

    <!-- The privacy policy lives on the home page, and this page can be served
         from any path, so the banner needs an absolute link to it. -->
    <script>
      window.pecPrivacyPolicyHref = "/#privacy-policy";
    </script>
    <link rel="stylesheet" href="/assets/css/consent.css" />

    <!-- Deliberately avoids main.css and slideshow.js: together they hide the
         page behind a loading overlay until the slideshow is ready, which would
         strand visitors on a black screen here. The consent files above and
         below carry no such overlay, so they are safe to share. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #1b1f22;
        color: #ffffff;
        font-family: 'Source Sans Pro', Helvetica, sans-serif;
        font-size: 16px;
        line-height: 1.65;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
        /* min-height, not height: with the cookie banner up, a short screen
           needs the page to grow and scroll rather than trap the button
           underneath it. */
        min-height: 100vh;
      }

      img {
        width: 8rem;
        height: 8rem;
        max-width: 60vw;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: 0.1rem;
        text-transform: uppercase;
        margin: 0 0 1rem 0;
      }

      p {
        max-width: 32rem;
        margin: 0 0 2rem 0;
        color: rgba(255, 255, 255, 0.75);
      }

      a.home {
        display: inline-block;
        border: solid 2px #ffffff;
        border-radius: 4px;
        padding: 0.75rem 1.75rem;
        color: #ffffff;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.1rem;
        font-size: 0.8rem;
        font-weight: 600;
        transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out;
      }

      a.home:hover {
        background-color: #ffffff;
        color: #1b1f22;
      }
    </style>
  </head>
  <body class="error-page">
    <img
      src="/images/percival-estate-logo-white-padding.png"
      alt="Percival Estate Community logo"
    />
    <h1>Page not found</h1>
    <p>
      Sorry, we couldn't find that page. It may have moved, or the link may be
      out of date.
    </p>
    <a class="home" href="/">Back to the estate</a>

    <script src="/assets/js/consent.js"></script>
  </body>
</html>
